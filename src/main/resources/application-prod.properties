spring.config.activate.on-profile=prod

# Datasource — Spring resolve automaticamente via SPRING_DATASOURCE_*
# spring.datasource.url      <- SPRING_DATASOURCE_URL
# spring.datasource.username <- SPRING_DATASOURCE_USERNAME
# spring.datasource.password <- SPRING_DATASOURCE_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

app.upload.dir=/app/uploads
app.upload.max-file-size=10MB
app.upload.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx
app.upload.avatar-max-size=2MB

# Application URL — ainda precisa de ${APP_BASE_URL} resolvido
app.base-url=${APP_BASE_URL}
