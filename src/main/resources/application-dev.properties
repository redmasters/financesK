spring.config.activate.on-profile=dev
spring.datasource.url=jdbc:postgresql://localhost:5432/financesk_db
spring.datasource.username=financesk_admin
spring.datasource.password=${POSTGRES_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações de upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

spring.mail.support-mail=${MAIL_USERNAME:mail@mail}
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:user}
spring.mail.password=${MAIL_PASSWORD:pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Diretório para armazenamento de arquivos
app.upload.dir=/app/uploads
app.upload.max-file-size=10MB
app.upload.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx
app.upload.avatar-max-size=2MB

# Application URL Configuration
app.base-url=http://localhost:4200
